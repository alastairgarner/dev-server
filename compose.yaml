name: dev-server

services:
  mongo:
    image: mongo:8.0.32
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "127.0.0.1:27017:27017"
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

# External volumes make data ownership independent of Compose.
# Even "docker compose down -v" will not delete these volumes.
volumes:
  mongo-data:
    external: true
    name: ${MONGO_DATA_VOLUME:-dev-server-mongo-data}
  mongo-config:
    external: true
    name: ${MONGO_CONFIG_VOLUME:-dev-server-mongo-config}
  redis-data:
    external: true
    name: ${REDIS_DATA_VOLUME:-dev-server-redis-data}
