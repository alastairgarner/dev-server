include classpath("application.conf")

# Queue URLs report this address; must match the published host port.
node-address {
  protocol = http
  host = "127.0.0.1"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = false
}

# Declared queues are created on every start. Messages are held in memory only.
queues {
  sn-worker-local {
    # sn-web worker default (WORKER_SQS_VISIBILITY_TIMEOUT_SECONDS) is 300.
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 0 seconds
  }
}
